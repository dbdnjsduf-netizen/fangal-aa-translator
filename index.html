<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fangal AA Translator</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
      @font-face {
        font-family: 'Saitamaar';
        font-style: normal;
        font-weight: normal;
        src:
          url(https://clickin.github.io/SaitamaarFont/webfonts/Saitamaar-Regular.woff2) format('woff2'),
          url(https://clickin.github.io/SaitamaarFont/ttf/Saitamaar-Regular.ttf) format('truetype');
      }

      body {
        font-family: 'Noto Sans KR', sans-serif;
      }
      /* Match d4c-aa-viewer's AA rendering stack. */
      .font-aa {
        font-family: Saitamaar, 'MS PGothic', 'TextAA', 'IPAMonaPGothic', 'Monapo', 'Mona', monospace;
        font-style: normal;
        font-weight: normal;
      }
    </style>
  </head>
  <body class="bg-slate-900 text-slate-100 h-screen overflow-hidden selection:bg-blue-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
